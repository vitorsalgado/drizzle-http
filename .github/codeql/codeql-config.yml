name: "CodeQL Config"

queries:
  - uses: security-and-quality

paths:
  - packages
paths-ignore:
  - node_modules
  - packages/**/node_modules
  - packages/**/dist
  - packages/**/_tests
  - packages/drizzle-fetch/e2e
  - _tests
  - internal
  - _benchmarks
  - _examples
  - scripts
  - test
  - '**/*.spec.js'
  - '**/*.spec.ts'
